name: Dependabot auto-merge

# Auto-merges Dependabot PRs for minor/patch updates once CI passes. Majors
# are deliberately excluded — dependabot.yml already keeps them out of the
# grouped minor-and-patch PR for manual scrutiny (astro 5->7 and vite 6->8
# both broke CI/typecheck on first attempt, 2026-07-17 — majors are exactly
# where that risk concentrates). Relies on branch protection requiring the
# `ci` status check on main, so `--auto` actually waits for it.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (minor/patch only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
